name: kodicmd testing

on:
  push:
    branches: [ kodicmd ]
  pull_request:
    branches: [ kodicmd ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt \
          git+https://github.com/jonisb/jsbc.compat.git#egg=jsbc.compat \
          git+https://github.com/jonisb/Toolbox.git#egg=jsbc.Toolbox \
          git+https://github.com/jonisb/jsbc.network.git#egg=jsbc.network \
          pytest pytest-cov
        
    - name: Install jsbc.KodiLib
      run: |
        pip install .        
    
    - name: Install Kodi
      run: |
        sudo apt-get update
        sudo apt-get install -y kodi
    
    - name: Run Kodi
      run: |
        xvfb-run -a kodi &
        KODI_PID=$!
        # Wait for Kodi's JSON-RPC to be available (timeout after 120s)
        # timeout 120 bash -c 'until curl -s http://localhost:8080/jsonrpc -d "{\"jsonrpc\":\"2.0\",\"method\":\"JSONRPC.Ping\",\"id\":1}" | grep -q "pong"; do sleep 1; done' || { echo "Kodi failed to start"; exit 1; }
        sleep 60
        echo "KODI_PID=$KODI_PID" >> $GITHUB_ENV

    - name: Run tests
      run: pytest tests/ --verbose -n auto --junitxml=test-results.xml --cov=. --cov-report=xml

    - name: Stop Kodi
      if: always() && env.KODI_PID
      run: |
        # Stop Kodi process if it exists
        if ps -p ${{ env.KODI_PID }} > /dev/null; then
          echo "Stopping Kodi (PID: ${{ env.KODI_PID }})"
          timeout 10s kill ${{ env.KODI_PID }} || { echo "Failed to terminate Kodi, attempting SIGKILL"; timeout 5s kill -9 ${{ env.KODI_PID }}; }
          wait ${{ env.KODI_PID }} || echo "Kodi process already terminated"
        else
          echo "Kodi process (PID: ${{ env.KODI_PID }}) not found"
        fi
        
    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          test-results.xml
          coverage.xml
          ~/.kodi/temp/kodi.log
          ~/.kodi/temp/kodi.old
